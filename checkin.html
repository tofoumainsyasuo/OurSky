<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05040d">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" href="icon-192.png">
<title>check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#05040d; --deep:#100c26; --horizon:#241f45;
    --gold:#f0c169; --rose:#dd8291; --moonlight:#f5f2fb;
    --dim:rgba(245,242,251,0.55); --glass-border:rgba(245,242,251,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 18% -10%, var(--horizon), transparent 55%),
      radial-gradient(ellipse at 88% 108%, var(--horizon), transparent 50%),
      linear-gradient(180deg, var(--deep), var(--void) 72%);
    color:var(--moonlight);
    font-family:'Manrope', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    opacity:0;
    animation:pageIn 0.9s ease forwards;
    padding:9vh 1.5rem 5vh;
  }
  button, input{font-family:inherit; color:inherit; -webkit-tap-highlight-color:transparent;}
  @keyframes pageIn{ to{ opacity:1; } }
  @media (prefers-reduced-motion: reduce){ body{animation:none; opacity:1;} }

  .nebula{position:fixed; width:56vmax; height:56vmax; border-radius:50%; filter:blur(80px); mix-blend-mode:screen; pointer-events:none;}
  #nebulaA{top:-16vmax; right:-14vmax; background:radial-gradient(circle, var(--gold) 0%, transparent 68%); opacity:0.14; animation:driftA 66s ease-in-out infinite; z-index:1;}
  #nebulaB{bottom:-18vmax; left:-16vmax; background:radial-gradient(circle, var(--rose) 0%, transparent 68%); opacity:0.14; animation:driftB 78s ease-in-out infinite; z-index:1;}
  @keyframes driftA{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-4%,5%) scale(1.08);} }
  @keyframes driftB{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(5%,-4%) scale(1.07);} }
  @media (prefers-reduced-motion: reduce){ .nebula{animation:none !important;} }

  body::before{
    content:"";
    position:fixed; top:0; left:0; right:0; height:90px;
    background:linear-gradient(to bottom, rgba(5,4,13,0.85), transparent);
    pointer-events:none;
    z-index:15;
  }
  .nav-row{position:fixed; top:16px; left:16px; display:flex; gap:0.5rem; z-index:20;}
  .nav-pill{
    padding:0.5rem 0.9rem; border-radius:999px;
    border:1px solid var(--glass-border);
    background:rgba(16,12,38,0.55);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    color:var(--dim);
    font-family:'JetBrains Mono', monospace;
    font-size:0.7rem; letter-spacing:0.06em;
    text-decoration:none;
    transition:color 0.15s ease, background 0.15s ease;
  }
  .nav-pill:hover{color:var(--moonlight); background:rgba(16,12,38,0.75);}

  .menu-btn{
    position:fixed; top:16px; right:16px; width:34px; height:34px;
    border-radius:50%; border:1px solid var(--glass-border);
    background:rgba(16,12,38,0.55);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    color:var(--dim); font-size:1.1rem; line-height:1; cursor:pointer;
    z-index:20; transition:color 0.15s ease, background 0.15s ease;
  }
  .menu-btn:hover{color:var(--moonlight); background:rgba(16,12,38,0.75);}
  .menu-panel{
    position:fixed; top:56px; right:16px; width:200px;
    background:rgba(16,12,38,0.92); border:1px solid var(--glass-border);
    border-radius:14px; padding:0.4rem;
    box-shadow:0 14px 40px rgba(0,0,0,0.45);
    opacity:0; transform:translateY(-6px); pointer-events:none;
    transition:opacity 0.16s ease, transform 0.16s ease; z-index:21;
  }
  .menu-panel.show{opacity:1; transform:translateY(0); pointer-events:auto;}
  .menu-item{
    display:block; width:100%; background:none; border:none;
    font-size:0.85rem; text-align:left; padding:0.55rem 0.6rem;
    border-radius:8px; cursor:pointer;
  }
  .menu-item:hover{background:rgba(245,242,251,0.06);}

  .content{position:relative; z-index:10; max-width:34rem; width:100%; margin:0 auto;}
  .hero-text{text-align:center; margin-bottom:2.6rem;}
  .eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:0.7rem;
    letter-spacing:0.24em; text-transform:uppercase; color:var(--dim);
    margin-bottom:1rem;
  }
  h1{
    font-family:'Fraunces', serif; font-weight:500;
    font-size:clamp(1.7rem, 5.2vw, 2.4rem); line-height:1.25;
    letter-spacing:-0.01em; max-width:24ch; margin:0 auto;
  }
  .lede{margin-top:0.9rem; max-width:26rem; margin-left:auto; margin-right:auto; color:var(--dim); font-size:0.92rem; line-height:1.6;}

  .habit-section{margin-bottom:2.2rem;}
  .habit-section-label{
    font-family:'JetBrains Mono', monospace; font-size:0.68rem;
    letter-spacing:0.16em; text-transform:uppercase; color:var(--dim);
    margin-bottom:0.8rem;
  }
  .habit-section.mine .habit-section-label{color:var(--gold);}
  .habit-section.theirs .habit-section-label{color:var(--rose);}

  .habit-list{display:flex; flex-direction:column; gap:0.6rem;}
  .habit-row{
    display:flex; align-items:center; gap:0.8rem;
    background:rgba(16,12,38,0.5); border:1px solid var(--glass-border);
    border-radius:16px; padding:0.75rem 0.9rem;
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  }
  .habit-check{
    flex-shrink:0; width:28px; height:28px; border-radius:50%;
    border:1.5px solid var(--glass-border); background:transparent;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    color:transparent; font-size:0.85rem;
    transition:background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }
  .habit-check:active{transform:scale(0.9);}
  .habit-check.done{background:var(--gold); border-color:var(--gold); color:var(--void);}
  .habit-status-dot{
    flex-shrink:0; width:12px; height:12px; border-radius:50%;
    border:1.5px solid var(--glass-border); margin:0 8px;
  }
  .habit-status-dot.done{background:var(--rose); border-color:var(--rose); box-shadow:0 0 8px var(--rose);}
  .habit-info{flex:1; min-width:0;}
  .habit-text{font-size:0.92rem; color:var(--moonlight); margin-bottom:0.35rem; word-break:break-word;}
  .habit-pips{display:flex; gap:3px; align-items:center;}
  .pip{width:6px; height:6px; border-radius:50%; background:rgba(245,242,251,0.15);}
  .pip.on{background:var(--gold);}
  .habit-section.theirs .pip.on{background:var(--rose);}
  .habit-streak{font-family:'JetBrains Mono', monospace; font-size:0.65rem; color:var(--dim); margin-left:4px;}
  .counter-progress{font-family:'JetBrains Mono', monospace; font-size:0.72rem; color:var(--dim); margin-bottom:0.35rem;}
  .counter-bar{height:5px; background:rgba(245,242,251,0.1); border-radius:999px; overflow:hidden; margin-bottom:0.35rem;}
  .counter-bar-fill{height:100%; background:var(--gold); border-radius:999px; transition:width 0.3s ease;}
  .habit-section.theirs .counter-bar-fill{background:var(--rose);}
  .counter-btn{
    flex-shrink:0; width:28px; height:28px; border-radius:50%;
    border:1.5px solid var(--glass-border); background:transparent;
    color:var(--moonlight); cursor:pointer; font-size:1rem; line-height:1;
    display:flex; align-items:center; justify-content:center;
    transition:background 0.15s ease, transform 0.15s ease;
  }
  .counter-btn:active{transform:scale(0.9);}
  .counter-btn:hover{background:rgba(245,242,251,0.08);}
  .habit-cheer{
    flex-shrink:0; background:none; border:none; cursor:pointer;
    font-size:1.05rem; color:var(--dim); padding:0.3rem;
    transition:color 0.15s ease, transform 0.15s ease;
  }
  .habit-cheer:hover{transform:scale(1.15);}
  .habit-cheer.cheered{color:var(--rose);}
  .habit-delete{flex-shrink:0; background:none; border:none; color:var(--dim); font-size:1.1rem; cursor:pointer; padding:0.3rem;}
  .habit-delete:hover{color:var(--rose);}
  .cheer-badge{
    font-family:'JetBrains Mono', monospace; font-size:0.65rem;
    color:var(--rose); margin-top:0.3rem;
  }
  .habit-empty{color:var(--dim); font-style:italic; font-size:0.85rem; padding:0.4rem 0;}

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(5,4,13,0.72);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; padding:1.5rem;
    opacity:0; pointer-events:none; transition:opacity 0.2s ease; z-index:40;
  }
  .modal-backdrop.show{opacity:1; pointer-events:auto;}
  .modal-card{
    width:min(92vw,420px);
    background:rgba(16,12,38,0.94); border:1px solid var(--glass-border);
    border-radius:20px; padding:1.4rem;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
    transform:translateY(10px) scale(0.98); transition:transform 0.2s ease;
    text-align:left;
  }
  .modal-backdrop.show .modal-card{transform:translateY(0) scale(1);}
  .modal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem;}
  .modal-header h3{font-family:'Fraunces',serif; font-style:italic; font-weight:500; font-size:1.15rem;}
  .modal-close{background:none; border:none; color:var(--dim); font-size:1.5rem; cursor:pointer; line-height:1; padding:0.2rem 0.4rem;}
  .modal-close:hover{color:var(--moonlight);}
  .habit-type-toggle{display:flex; gap:0.4rem; margin-bottom:0.7rem;}
  .type-option{
    flex:1; padding:0.5rem; border-radius:8px;
    border:1px solid var(--glass-border);
    background:rgba(245,242,251,0.04);
    color:var(--dim); font-size:0.8rem; cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .type-option.active{background:rgba(240,193,105,0.12); border-color:rgba(240,193,105,0.4); color:var(--gold);}
  .counter-fields{display:none; gap:0.5rem; margin-bottom:0.6rem;}
  .counter-fields.show{display:flex;}
  .counter-fields input{
    flex:1; background:rgba(245,242,251,0.06); border:1px solid var(--glass-border);
    border-radius:12px; padding:0.7rem 0.85rem; font-size:0.9rem;
  }
  .counter-fields input::placeholder{color:rgba(245,242,251,0.35);}
  #habitInput{
    width:100%; background:rgba(245,242,251,0.06); border:1px solid var(--glass-border);
    border-radius:12px; padding:0.7rem 0.85rem; font-size:0.9rem; margin-bottom:0.6rem;
  }
  #habitInput::placeholder{color:rgba(245,242,251,0.35);}
  .form-error{display:none; color:var(--rose); font-size:0.78rem; margin-bottom:0.6rem;}
  .form-error.show{display:block;}
  #habitForm button[type="submit"]{
    width:100%; background:var(--gold); color:var(--void); border:none; border-radius:10px;
    padding:0.65rem; font-weight:600; font-size:0.88rem; cursor:pointer;
  }

  .identity-sub{color:var(--dim); font-size:0.85rem; margin-bottom:1.1rem;}
  .identity-choices{display:flex; gap:0.7rem;}
  .identity-btn{
    flex:1; padding:0.9rem; border-radius:14px; border:1px solid var(--glass-border);
    background:rgba(245,242,251,0.05); font-weight:600; font-size:0.95rem; cursor:pointer;
    transition:background 0.15s ease, border-color 0.15s ease;
  }
  .identity-btn.gold{color:var(--gold);}
  .identity-btn.rose{color:var(--rose);}
  .identity-btn.gold:hover{background:rgba(245,242,251,0.1); border-color:rgba(240,193,105,0.4);}
  .identity-btn.rose:hover{background:rgba(245,242,251,0.1); border-color:rgba(221,130,145,0.4);}

  #toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(6px);
    background:rgba(16,12,38,0.88); border:1px solid var(--glass-border);
    backdrop-filter:blur(14px); color:var(--moonlight);
    font-family:'JetBrains Mono', monospace; font-size:0.72rem;
    padding:0.5rem 1rem; border-radius:999px; white-space:nowrap;
    pointer-events:none; opacity:0;
    transition:opacity 0.18s ease, transform 0.18s ease; z-index:50;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="nebula" id="nebulaA"></div>
<div class="nebula" id="nebulaB"></div>

<div class="nav-row">
  <a href="index.html" class="nav-pill">&larr; the sky</a>
  <a href="reasons.html" class="nav-pill">reasons</a>
</div>
<button type="button" class="menu-btn" id="menuBtn" aria-label="More options">&#8943;</button>
<div class="menu-panel" id="menuPanel">
  <button type="button" class="menu-item" id="menuAddMine">Add to your list</button>
  <button type="button" class="menu-item" id="menuAddTheirs">Add to their list</button>
</div>

<div class="modal-backdrop" id="identityBackdrop">
  <div class="modal-card">
    <div class="modal-header"><h3>which one are you?</h3></div>
    <p class="identity-sub">So we know which list is which.</p>
    <div class="identity-choices">
      <button type="button" class="identity-btn gold" id="identityA">Inno</button>
      <button type="button" class="identity-btn rose" id="identityB">Yuki</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="addBackdrop">
  <div class="modal-card">
    <div class="modal-header">
      <h3 id="addHabitTitle">add a habit</h3>
      <button type="button" class="modal-close" id="addClose" aria-label="Close">&times;</button>
    </div>
    <form id="habitForm">
      <div class="habit-type-toggle">
        <button type="button" class="type-option active" data-type="check">Simple check</button>
        <button type="button" class="type-option" data-type="counter">Counter</button>
      </div>
      <input type="text" id="habitInput" placeholder="e.g. drink water" maxlength="60">
      <div class="counter-fields" id="counterFields">
        <input type="number" id="habitTarget" placeholder="Goal, e.g. 8" min="1" max="99">
        <input type="text" id="habitUnit" placeholder="Unit, e.g. glasses" maxlength="20">
      </div>
      <p class="form-error" id="habitFormError"></p>
      <button type="submit">Add it</button>
    </form>
  </div>
</div>

<div id="toast"></div>

<div class="content">
  <div class="hero-text">
    <div class="eyebrow">for the small stuff too</div>
    <h1>Not all of it's romantic. Some of it's just remembering to drink water.</h1>
    <p class="lede">You each keep your own list — the other can see it, cheer you on, and add a thing or two of their own.</p>
  </div>

  <div class="habit-section mine">
    <div class="habit-section-label" id="mineLabel">you</div>
    <div class="habit-list" id="mineList"></div>
  </div>

  <div class="habit-section theirs">
    <div class="habit-section-label" id="theirsLabel">them</div>
    <div class="habit-list" id="theirsList"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js';
import { getDatabase, ref, push, set, remove, onValue } from 'https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyDo6kwf9QtiLXCelZDSy_a6ktv6mTC6fa4",
  authDomain: "oursky-1b847.firebaseapp.com",
  databaseURL: "https://oursky-1b847-default-rtdb.firebaseio.com",
  projectId: "oursky-1b847",
  storageBucket: "oursky-1b847.firebasestorage.app",
  messagingSenderId: "1029333881661",
  appId: "1:1029333881661:web:0ffef5df392bc984c7ab54"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getDatabase(firebaseApp);

const IDENTITY_KEY = 'missedyou_identity';
const NAME_A = 'Inno';
const NAME_B = 'Yuki';
function nameFor(who){ return who === 'A' ? NAME_A : NAME_B; }
function otherOf(who){ return who === 'A' ? 'B' : 'A'; }
function getIdentity(){ return localStorage.getItem(IDENTITY_KEY); }
function setIdentity(who){ localStorage.setItem(IDENTITY_KEY, who); }

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function todayKey(){
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}
function last7Keys(){
  const keys = [];
  for(let i=6;i>=0;i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    keys.push(d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate());
  }
  return keys;
}
function dateKeyToStart(key){
  const [y,m,d] = key.split('-').map(Number);
  return new Date(y, m-1, d).getTime();
}
function computeStreak(checkinMap, target){
  const map = checkinMap || {};
  const isDone = target ? (k => (Number(map[k])||0) >= target) : (k => !!map[k]);
  const days = new Set(Object.keys(map).filter(isDone).map(dateKeyToStart));
  const oneDay = 86400000;
  let cursor = dateKeyToStart(todayKey());
  if(!days.has(cursor)) cursor -= oneDay;
  let streak = 0;
  while(days.has(cursor)){ streak++; cursor -= oneDay; }
  return streak;
}

let habitsCache = { A: {}, B: {} };
let checkinsCache = { A: {}, B: {} };
let cheersCache = { A: {}, B: {} };

const identityBackdrop = document.getElementById('identityBackdrop');
const addBackdrop = document.getElementById('addBackdrop');
const menuBtn = document.getElementById('menuBtn');
const menuPanel = document.getElementById('menuPanel');

let toastTimeout = null;
function showToast(message, duration){
  const t = document.getElementById('toast');
  t.textContent = message;
  t.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(()=>t.classList.remove('show'), duration || 2200);
}

function openIdentityModal(){ identityBackdrop.classList.add('show'); }
function closeIdentityModal(){ identityBackdrop.classList.remove('show'); }
document.getElementById('identityA').addEventListener('click', ()=>{ setIdentity('A'); closeIdentityModal(); renderAll(); });
document.getElementById('identityB').addEventListener('click', ()=>{ setIdentity('B'); closeIdentityModal(); renderAll(); });
identityBackdrop.addEventListener('click', (e)=>{ if(e.target === identityBackdrop) closeIdentityModal(); });

menuBtn.addEventListener('click', (e)=>{ e.stopPropagation(); menuPanel.classList.toggle('show'); });
document.addEventListener('click', (e)=>{
  if(menuPanel.classList.contains('show') && !menuPanel.contains(e.target) && e.target !== menuBtn){
    menuPanel.classList.remove('show');
  }
});
document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Escape') return;
  identityBackdrop.classList.remove('show');
  addBackdrop.classList.remove('show');
  menuPanel.classList.remove('show');
});

let addTarget = null;
let habitType = 'check';
function openAddModal(target){
  const who = getIdentity();
  if(!who){ openIdentityModal(); return; }
  addTarget = target;
  habitType = 'check';
  document.querySelectorAll('.type-option').forEach(b=>b.classList.toggle('active', b.dataset.type==='check'));
  document.getElementById('counterFields').classList.remove('show');
  document.getElementById('addHabitTitle').textContent = target === who ? 'add to your list' : ('add to ' + nameFor(target) + '\u2019s list');
  document.getElementById('habitInput').value = '';
  document.getElementById('habitTarget').value = '';
  document.getElementById('habitUnit').value = '';
  document.getElementById('habitFormError').classList.remove('show');
  addBackdrop.classList.add('show');
}
document.querySelectorAll('.type-option').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    habitType = btn.dataset.type;
    document.querySelectorAll('.type-option').forEach(b=>b.classList.toggle('active', b===btn));
    document.getElementById('counterFields').classList.toggle('show', habitType === 'counter');
  });
});
document.getElementById('menuAddMine').addEventListener('click', ()=>{
  menuPanel.classList.remove('show');
  const who = getIdentity();
  if(!who){ openIdentityModal(); return; }
  openAddModal(who);
});
document.getElementById('menuAddTheirs').addEventListener('click', ()=>{
  menuPanel.classList.remove('show');
  const who = getIdentity();
  if(!who){ openIdentityModal(); return; }
  openAddModal(otherOf(who));
});
document.getElementById('addClose').addEventListener('click', ()=>addBackdrop.classList.remove('show'));
addBackdrop.addEventListener('click', (e)=>{ if(e.target === addBackdrop) addBackdrop.classList.remove('show'); });

document.getElementById('habitForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const errorEl = document.getElementById('habitFormError');
  const text = document.getElementById('habitInput').value.trim();
  const who = getIdentity();
  const goal = parseInt(document.getElementById('habitTarget').value, 10);
  const unit = document.getElementById('habitUnit').value.trim();
  try{
    if(!text){
      errorEl.textContent = 'Write something first.';
      errorEl.classList.add('show');
      return;
    }
    if(habitType === 'counter' && (!goal || goal < 1)){
      errorEl.textContent = 'Give it a daily goal, like 8.';
      errorEl.classList.add('show');
      return;
    }
    if(!who || !addTarget){
      errorEl.textContent = 'Something went wrong \u2014 reload and try again.';
      errorEl.classList.add('show');
      return;
    }
    errorEl.classList.remove('show');
    const habitData = habitType === 'counter'
      ? { text, addedBy: who, time: Date.now(), type: 'counter', target: goal, unit: unit || 'times' }
      : { text, addedBy: who, time: Date.now(), type: 'check' };
    set(push(ref(db, 'habits/' + addTarget)), habitData).then(()=>{
      addBackdrop.classList.remove('show');
      showToast('Added \u2713');
    }).catch(err=>{
      errorEl.textContent = 'Error: ' + (err && err.message ? err.message : String(err));
      errorEl.classList.add('show');
    });
  } catch(err){
    errorEl.textContent = 'Error: ' + (err && err.message ? err.message : String(err));
    errorEl.classList.add('show');
  }
});

function toggleCheckin(owner, habitId){
  const key = todayKey();
  const isDone = !!(checkinsCache[owner] && checkinsCache[owner][habitId] && checkinsCache[owner][habitId][key]);
  set(ref(db, 'checkins/' + owner + '/' + habitId + '/' + key), isDone ? null : true);
}
function bumpCounter(owner, habitId, delta){
  const key = todayKey();
  const current = Number(checkinsCache[owner] && checkinsCache[owner][habitId] && checkinsCache[owner][habitId][key]) || 0;
  const next = Math.max(0, current + delta);
  set(ref(db, 'checkins/' + owner + '/' + habitId + '/' + key), next === 0 ? null : next);
}
function toggleCheer(owner, habitId){
  const key = todayKey();
  const existing = cheersCache[owner] && cheersCache[owner][habitId] && cheersCache[owner][habitId][key];
  const who = getIdentity();
  if(existing){
    set(ref(db, 'cheers/' + owner + '/' + habitId + '/' + key), null);
  } else {
    set(ref(db, 'cheers/' + owner + '/' + habitId + '/' + key), { from: who, time: Date.now() });
  }
}
function deleteHabit(owner, habitId){
  remove(ref(db, 'habits/' + owner + '/' + habitId));
  remove(ref(db, 'checkins/' + owner + '/' + habitId));
  remove(ref(db, 'cheers/' + owner + '/' + habitId));
}

function isHabitDoneToday(owner, habitId, habit){
  const key = todayKey();
  const val = checkinsCache[owner] && checkinsCache[owner][habitId] && checkinsCache[owner][habitId][key];
  if(habit.type === 'counter') return (Number(val)||0) >= habit.target;
  return !!val;
}
function renderPips(owner, habitId, target){
  const map = (checkinsCache[owner] && checkinsCache[owner][habitId]) || {};
  const isOn = target ? (k => (Number(map[k])||0) >= target) : (k => !!map[k]);
  return last7Keys().map(k => `<span class="pip ${isOn(k) ? 'on' : ''}"></span>`).join('');
}

function renderMineRow(id, habit, owner){
  const key = todayKey();
  const streak = computeStreak(checkinsCache[owner] && checkinsCache[owner][id], habit.target);
  const cheer = cheersCache[owner] && cheersCache[owner][id] && cheersCache[owner][id][key];
  const cheerBadge = cheer ? `<div class="cheer-badge">\u2661 ${nameFor(cheer.from)} cheered you on</div>` : '';
  const streakTag = `<span class="habit-streak">${streak>0 ? streak+'d streak' : ''}</span>`;
  const deleteBtn = `<button type="button" class="habit-delete" data-action="delete" data-id="${id}" aria-label="Delete">&times;</button>`;

  if(habit.type === 'counter'){
    const count = Number(checkinsCache[owner] && checkinsCache[owner][id] && checkinsCache[owner][id][key]) || 0;
    const pct = Math.min(100, (count/habit.target)*100);
    return `<div class="habit-row" data-id="${id}">
      <button type="button" class="counter-btn" data-action="decrement" data-id="${id}" aria-label="Minus one">\u2212</button>
      <div class="habit-info">
        <div class="habit-text">${escapeHtml(habit.text)}</div>
        <div class="counter-progress">${count} / ${habit.target} ${escapeHtml(habit.unit||'')}</div>
        <div class="counter-bar"><div class="counter-bar-fill" style="width:${pct}%"></div></div>
        <div class="habit-pips">${renderPips(owner, id, habit.target)}${streakTag}</div>
        ${cheerBadge}
      </div>
      <button type="button" class="counter-btn" data-action="increment" data-id="${id}" aria-label="Plus one">+</button>
      ${deleteBtn}
    </div>`;
  }

  const done = isHabitDoneToday(owner, id, habit);
  return `<div class="habit-row" data-id="${id}">
    <button type="button" class="habit-check ${done?'done':''}" data-action="check" data-id="${id}">${done ? '&#10003;' : ''}</button>
    <div class="habit-info">
      <div class="habit-text">${escapeHtml(habit.text)}</div>
      <div class="habit-pips">${renderPips(owner, id)}${streakTag}</div>
      ${cheerBadge}
    </div>
    ${deleteBtn}
  </div>`;
}
function renderTheirRow(id, habit, owner){
  const key = todayKey();
  const done = isHabitDoneToday(owner, id, habit);
  const streak = computeStreak(checkinsCache[owner] && checkinsCache[owner][id], habit.target);
  const cheered = !!(cheersCache[owner] && cheersCache[owner][id] && cheersCache[owner][id][key]);
  const streakTag = `<span class="habit-streak">${streak>0 ? streak+'d streak' : ''}</span>`;
  const cheerBtn = done ? `<button type="button" class="habit-cheer ${cheered?'cheered':''}" data-action="cheer" data-id="${id}" aria-label="Cheer">&#9825;</button>` : '';
  const deleteBtn = habit.addedBy === getIdentity()
    ? `<button type="button" class="habit-delete" data-action="delete-theirs" data-id="${id}" aria-label="Delete">&times;</button>`
    : '';

  if(habit.type === 'counter'){
    const count = Number(checkinsCache[owner] && checkinsCache[owner][id] && checkinsCache[owner][id][key]) || 0;
    const pct = Math.min(100, (count/habit.target)*100);
    return `<div class="habit-row" data-id="${id}">
      <div class="habit-info">
        <div class="habit-text">${escapeHtml(habit.text)}</div>
        <div class="counter-progress">${count} / ${habit.target} ${escapeHtml(habit.unit||'')}</div>
        <div class="counter-bar"><div class="counter-bar-fill" style="width:${pct}%"></div></div>
        <div class="habit-pips">${renderPips(owner, id, habit.target)}${streakTag}</div>
      </div>
      ${cheerBtn}
      ${deleteBtn}
    </div>`;
  }

  return `<div class="habit-row" data-id="${id}">
    <span class="habit-status-dot ${done?'done':''}"></span>
    <div class="habit-info">
      <div class="habit-text">${escapeHtml(habit.text)}</div>
      <div class="habit-pips">${renderPips(owner, id)}${streakTag}</div>
    </div>
    ${cheerBtn}
    ${deleteBtn}
  </div>`;
}

function renderAll(){
  const who = getIdentity();
  const mineListEl = document.getElementById('mineList');
  const theirsListEl = document.getElementById('theirsList');
  if(!who){
    mineListEl.innerHTML = `<p class="habit-empty">pick who you are first.</p>`;
    theirsListEl.innerHTML = '';
    return;
  }
  const other = otherOf(who);
  document.getElementById('mineLabel').textContent = 'you';
  document.getElementById('theirsLabel').textContent = nameFor(other);

  const mine = habitsCache[who] || {};
  const mineIds = Object.keys(mine).sort((a,b)=>mine[a].time-mine[b].time);
  mineListEl.innerHTML = mineIds.length
    ? mineIds.map(id => renderMineRow(id, mine[id], who)).join('')
    : `<p class="habit-empty">nothing yet \u2014 add one from the menu.</p>`;

  const theirs = habitsCache[other] || {};
  const theirIds = Object.keys(theirs).sort((a,b)=>theirs[a].time-theirs[b].time);
  theirsListEl.innerHTML = theirIds.length
    ? theirIds.map(id => renderTheirRow(id, theirs[id], other)).join('')
    : `<p class="habit-empty">nothing on ${nameFor(other)}'s list yet.</p>`;

  mineListEl.querySelectorAll('[data-action="check"]').forEach(btn=>{
    btn.addEventListener('click', ()=> toggleCheckin(who, btn.dataset.id));
  });
  mineListEl.querySelectorAll('[data-action="increment"]').forEach(btn=>{
    btn.addEventListener('click', ()=> bumpCounter(who, btn.dataset.id, 1));
  });
  mineListEl.querySelectorAll('[data-action="decrement"]').forEach(btn=>{
    btn.addEventListener('click', ()=> bumpCounter(who, btn.dataset.id, -1));
  });
  mineListEl.querySelectorAll('[data-action="delete"]').forEach(btn=>{
    btn.addEventListener('click', ()=> deleteHabit(who, btn.dataset.id));
  });
  theirsListEl.querySelectorAll('[data-action="cheer"]').forEach(btn=>{
    btn.addEventListener('click', ()=> toggleCheer(other, btn.dataset.id));
  });
  theirsListEl.querySelectorAll('[data-action="delete-theirs"]').forEach(btn=>{
    btn.addEventListener('click', ()=> deleteHabit(other, btn.dataset.id));
  });
}

onValue(ref(db, 'habits'), (snapshot)=>{
  const val = snapshot.val() || {};
  habitsCache = {
    A: Object.fromEntries(Object.entries(val.A || {})),
    B: Object.fromEntries(Object.entries(val.B || {}))
  };
  renderAll();
});
onValue(ref(db, 'checkins'), (snapshot)=>{
  checkinsCache = snapshot.val() || { A:{}, B:{} };
  renderAll();
});
onValue(ref(db, 'cheers'), (snapshot)=>{
  cheersCache = snapshot.val() || { A:{}, B:{} };
  renderAll();
});

if(!getIdentity()) openIdentityModal();
</script>

</body>
</html>
