<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05040d">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" href="icon-192.png">
<title>reasons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#05040d;
    --deep:#100c26;
    --horizon:#241f45;
    --gold:#f0c169;
    --rose:#dd8291;
    --moonlight:#f5f2fb;
    --dim:rgba(245,242,251,0.55);
    --glass-border:rgba(245,242,251,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 18% -10%, var(--horizon), transparent 55%),
      radial-gradient(ellipse at 88% 108%, var(--horizon), transparent 50%),
      linear-gradient(180deg, var(--deep), var(--void) 72%);
    color:var(--moonlight);
    font-family:'Manrope', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    opacity:0;
    animation:pageIn 0.9s ease forwards;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:8vh 1.5rem 6vh;
  }
  button, input, textarea{font-family:inherit; color:inherit; -webkit-tap-highlight-color:transparent;}
  @keyframes pageIn{ to{ opacity:1; } }
  @media (prefers-reduced-motion: reduce){
    body{animation:none; opacity:1;}
  }

  .nebula{position:fixed; width:56vmax; height:56vmax; border-radius:50%; filter:blur(80px); mix-blend-mode:screen; pointer-events:none;}
  #nebulaA{top:-16vmax; right:-14vmax; background:radial-gradient(circle, var(--gold) 0%, transparent 68%); opacity:0.16; animation:driftA 66s ease-in-out infinite; z-index:1;}
  #nebulaB{bottom:-18vmax; left:-16vmax; background:radial-gradient(circle, var(--rose) 0%, transparent 68%); opacity:0.16; animation:driftB 78s ease-in-out infinite; z-index:1;}
  @keyframes driftA{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-4%,5%) scale(1.08);} }
  @keyframes driftB{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(5%,-4%) scale(1.07);} }
  @media (prefers-reduced-motion: reduce){ .nebula{animation:none !important;} }

  .nav-row{position:fixed; top:16px; left:16px; display:flex; gap:0.5rem; z-index:20;}
  .nav-pill{
    position:static;
    padding:0.5rem 0.9rem;
    border-radius:999px;
    border:1px solid var(--glass-border);
    background:rgba(16,12,38,0.55);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    color:var(--dim);
    font-family:'JetBrains Mono', monospace;
    font-size:0.7rem;
    letter-spacing:0.06em;
    text-decoration:none;
    z-index:20;
    transition:color 0.15s ease, background 0.15s ease;
  }
  .nav-pill:hover{color:var(--moonlight); background:rgba(16,12,38,0.75);}

  .menu-btn{
    position:fixed; top:16px; right:16px;
    width:34px; height:34px;
    border-radius:50%;
    border:1px solid var(--glass-border);
    background:rgba(16,12,38,0.55);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    color:var(--dim);
    font-size:1.1rem;
    line-height:1;
    cursor:pointer;
    z-index:20;
    transition:color 0.15s ease, background 0.15s ease;
  }
  .menu-btn:hover{color:var(--moonlight); background:rgba(16,12,38,0.75);}
  .menu-panel{
    position:fixed; top:56px; right:16px;
    width:190px;
    background:rgba(16,12,38,0.92);
    border:1px solid var(--glass-border);
    border-radius:14px;
    padding:0.4rem;
    box-shadow:0 14px 40px rgba(0,0,0,0.45);
    opacity:0; transform:translateY(-6px);
    pointer-events:none;
    transition:opacity 0.16s ease, transform 0.16s ease;
    z-index:21;
  }
  .menu-panel.show{opacity:1; transform:translateY(0); pointer-events:auto;}
  .menu-item{
    display:block; width:100%;
    background:none; border:none;
    font-size:0.85rem; text-align:left;
    padding:0.55rem 0.6rem;
    border-radius:8px;
    cursor:pointer;
  }
  .menu-item:hover{background:rgba(245,242,251,0.06);}

  .content{position:relative; z-index:10; max-width:36rem; width:100%; display:flex; flex-direction:column; align-items:center; text-align:center;}
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:0.7rem;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color:var(--dim);
    margin-bottom:1.1rem;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(1.8rem, 5.6vw, 2.7rem);
    line-height:1.2;
    letter-spacing:-0.01em;
    max-width:20ch;
  }
  h1 .accent{font-style:italic; font-weight:600; color:var(--gold);}
  .lede{
    margin-top:1rem;
    max-width:26rem;
    color:var(--dim);
    font-size:0.95rem;
    line-height:1.6;
  }

  .reason-stage{margin:3rem 0 1.2rem;}
  .reason-card{
    position:relative;
    width:min(84vw, 320px);
    height:360px;
    cursor:pointer;
  }
  .card-face{
    position:absolute; inset:0;
    border-radius:24px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:2rem 1.7rem;
    text-align:center;
    transition:opacity 0.5s ease, transform 0.5s ease;
    border:1px solid var(--glass-border);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:0 20px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .card-face.sealed{
    background:linear-gradient(160deg, rgba(240,193,105,0.14), rgba(221,130,145,0.14)), rgba(16,12,38,0.55);
  }
  .card-face.revealed{
    background:rgba(16,12,38,0.8);
    opacity:0;
    transform:scale(0.96);
    pointer-events:none;
    overflow:hidden;
  }
  .card-face.revealed::before{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(circle, rgba(245,242,251,0.4), transparent 60%);
    opacity:0;
    pointer-events:none;
  }
  .reason-card.is-revealed .card-face.sealed{opacity:0; transform:scale(1.04); pointer-events:none;}
  .reason-card.is-revealed .card-face.revealed{opacity:1; transform:scale(1); pointer-events:auto;}
  .reason-card.is-revealed .card-face.revealed::before{animation:revealFlash 0.7s ease-out;}
  @keyframes revealFlash{ 0%{opacity:0.8;} 100%{opacity:0;} }

  .seal-glow{
    width:56px; height:56px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(245,242,251,0.9), rgba(245,242,251,0) 70%);
    margin-bottom:1.2rem;
    animation:sealPulse 3s ease-in-out infinite;
  }
  @keyframes sealPulse{ 0%,100%{opacity:0.5; transform:scale(0.9);} 50%{opacity:1; transform:scale(1.08);} }
  @media (prefers-reduced-motion: reduce){ .seal-glow{animation:none;} }
  .seal-label{
    font-family:'JetBrains Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--dim);
  }

  .reason-text{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:1.2rem;
    line-height:1.55;
    color:var(--moonlight);
    margin-bottom:1.2rem;
    transition:opacity 0.25s ease;
    max-height:230px;
    overflow-y:auto;
  }
  .reason-meta{
    font-family:'JetBrains Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.05em;
    color:var(--gold);
    transition:opacity 0.25s ease;
  }

  .reveal-caption{
    font-family:'JetBrains Mono', monospace;
    font-size:0.68rem;
    letter-spacing:0.08em;
    color:var(--dim);
    min-height:1.2em;
  }

  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(5,4,13,0.72);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    padding:1.5rem;
    opacity:0; pointer-events:none;
    transition:opacity 0.2s ease;
    z-index:40;
  }
  .modal-backdrop.show{opacity:1; pointer-events:auto;}
  .modal-card{
    width:min(92vw,420px);
    max-height:80vh;
    overflow-y:auto;
    background:rgba(16,12,38,0.94);
    border:1px solid var(--glass-border);
    border-radius:20px;
    padding:1.4rem;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
    transform:translateY(10px) scale(0.98);
    transition:transform 0.2s ease;
    text-align:left;
  }
  .modal-backdrop.show .modal-card{transform:translateY(0) scale(1);}
  .modal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem;}
  .modal-header h3{font-family:'Fraunces',serif; font-style:italic; font-weight:500; font-size:1.15rem;}
  .modal-close{background:none; border:none; color:var(--dim); font-size:1.5rem; cursor:pointer; line-height:1; padding:0.2rem 0.4rem;}
  .modal-close:hover{color:var(--moonlight);}

  .identity-sub{color:var(--dim); font-size:0.85rem; margin-bottom:1.1rem;}
  .identity-choices{display:flex; gap:0.7rem;}
  .identity-btn{
    flex:1; padding:0.9rem; border-radius:14px;
    border:1px solid var(--glass-border);
    background:rgba(245,242,251,0.05);
    font-weight:600; font-size:0.95rem; cursor:pointer;
    transition:background 0.15s ease, border-color 0.15s ease;
  }
  .identity-btn.gold{color:var(--gold);}
  .identity-btn.rose{color:var(--rose);}
  .identity-btn.gold:hover{background:rgba(245,242,251,0.1); border-color:rgba(240,193,105,0.4);}
  .identity-btn.rose:hover{background:rgba(245,242,251,0.1); border-color:rgba(221,130,145,0.4);}

  #reasonInput{
    width:100%;
    background:rgba(245,242,251,0.06);
    border:1px solid var(--glass-border);
    border-radius:12px;
    padding:0.8rem;
    font-size:0.9rem;
    resize:vertical;
    margin-bottom:0.6rem;
  }
  #reasonInput::placeholder{color:rgba(245,242,251,0.35);}
  .form-error{
    display:none;
    color:var(--rose);
    font-size:0.78rem;
    margin-bottom:0.6rem;
  }
  .form-error.show{display:block;}
  #reasonForm button[type="submit"]{
    width:100%;
    background:var(--gold); color:var(--void); border:none; border-radius:10px;
    padding:0.65rem; font-weight:600; font-size:0.88rem; cursor:pointer;
  }

  .archive-empty{color:var(--dim); font-style:italic; font-size:0.88rem; padding:0.5rem 0;}
  .archive-item{padding:0.8rem 0; border-bottom:1px solid rgba(245,242,251,0.08);}
  .archive-item:last-child{border-bottom:none;}
  .archive-item-row{display:flex; align-items:flex-start; gap:0.6rem;}
  .archive-text{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:0.92rem;
    color:var(--moonlight);
    margin-bottom:0.35rem;
    line-height:1.5;
    flex:1;
  }
  .archive-delete{
    flex-shrink:0;
    background:none; border:none; color:var(--dim);
    font-size:1rem; cursor:pointer; padding:0.1rem 0.3rem;
  }
  .archive-delete:hover{color:var(--rose);}
  .archive-meta{font-family:'JetBrains Mono', monospace; font-size:0.68rem; color:var(--dim);}
  .archive-tabs{display:flex; gap:0.4rem; margin-bottom:1rem;}
  .archive-tab{
    flex:1; padding:0.5rem; border-radius:8px;
    border:1px solid var(--glass-border);
    background:rgba(245,242,251,0.04);
    color:var(--dim); font-size:0.8rem; cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .archive-tab.active{background:rgba(240,193,105,0.12); border-color:rgba(240,193,105,0.4); color:var(--gold);}

  #toast{
    position:fixed; left:50%; bottom:28px;
    transform:translateX(-50%) translateY(6px);
    background:rgba(16,12,38,0.88);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);
    color:var(--moonlight);
    font-family:'JetBrains Mono', monospace;
    font-size:0.72rem;
    padding:0.5rem 1rem;
    border-radius:999px;
    white-space:nowrap;
    pointer-events:none;
    opacity:0;
    transition:opacity 0.18s ease, transform 0.18s ease;
    z-index:50;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="nebula" id="nebulaA"></div>
<div class="nebula" id="nebulaB"></div>

<div class="nav-row">
  <a href="index.html" class="nav-pill">&larr; the sky</a>
  <a href="checkin.html" class="nav-pill">check-in</a>
</div>
<button type="button" class="menu-btn" id="menuBtn" aria-label="More options">&#8943;</button>
<div class="menu-panel" id="menuPanel">
  <button type="button" class="menu-item" id="menuAdd">Add a reason</button>
  <button type="button" class="menu-item" id="menuArchive">See all</button>
</div>

<div class="modal-backdrop" id="identityBackdrop">
  <div class="modal-card">
    <div class="modal-header"><h3>which one are you?</h3></div>
    <p class="identity-sub">So we know whose reasons to show you.</p>
    <div class="identity-choices">
      <button type="button" class="identity-btn gold" id="identityA">Inno</button>
      <button type="button" class="identity-btn rose" id="identityB">Yuki</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="addBackdrop">
  <div class="modal-card">
    <div class="modal-header">
      <h3>add a reason</h3>
      <button type="button" class="modal-close" id="addClose" aria-label="Close">&times;</button>
    </div>
    <form id="reasonForm">
      <textarea id="reasonInput" placeholder="Something true, specific, real..." maxlength="400" rows="4"></textarea>
      <p class="form-error" id="reasonFormError"></p>
      <button type="submit">Save it</button>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="archiveBackdrop">
  <div class="modal-card">
    <div class="modal-header">
      <h3>all of them</h3>
      <button type="button" class="modal-close" id="archiveClose" aria-label="Close">&times;</button>
    </div>
    <div class="archive-tabs">
      <button type="button" class="archive-tab active" data-scope="theirs">from them</button>
      <button type="button" class="archive-tab" data-scope="mine">yours</button>
    </div>
    <div id="archiveList"></div>
  </div>
</div>

<div id="toast"></div>

<div class="content">
  <div class="eyebrow">a small archive of why</div>
  <h1>Some reasons take <span class="accent">more than a tap</span> to say.</h1>
  <p class="lede">Tap the card whenever you want one — always something real, written by the other one of you.</p>

  <div class="reason-stage">
    <div class="reason-card" id="reasonCard">
      <div class="card-face sealed">
        <div class="seal-glow"></div>
        <span class="seal-label">tap for a reason</span>
      </div>
      <div class="card-face revealed">
        <p class="reason-text" id="reasonText"></p>
        <div class="reason-meta" id="reasonMeta"></div>
      </div>
    </div>
  </div>
  <div class="reveal-caption" id="revealCaption"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js';
import { getDatabase, ref, push, set, remove, onValue } from 'https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyDo6kwf9QtiLXCelZDSy_a6ktv6mTC6fa4",
  authDomain: "oursky-1b847.firebaseapp.com",
  databaseURL: "https://oursky-1b847-default-rtdb.firebaseio.com",
  projectId: "oursky-1b847",
  storageBucket: "oursky-1b847.firebasestorage.app",
  messagingSenderId: "1029333881661",
  appId: "1:1029333881661:web:0ffef5df392bc984c7ab54"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getDatabase(firebaseApp);

const IDENTITY_KEY = 'missedyou_identity';
const SEEN_KEY = 'missedyou_reasons_seen';
const NAME_A = 'Inno';
const NAME_B = 'Yuki';
function nameFor(who){ return who === 'A' ? NAME_A : NAME_B; }
function otherOf(who){ return who === 'A' ? 'B' : 'A'; }

function getIdentity(){ return localStorage.getItem(IDENTITY_KEY); }
function setIdentity(who){ localStorage.setItem(IDENTITY_KEY, who); }

function getSeenIds(){
  try{ return new Set(JSON.parse(localStorage.getItem(SEEN_KEY)) || []); }
  catch(e){ return new Set(); }
}
function markSeen(id){
  const seen = getSeenIds();
  seen.add(id);
  localStorage.setItem(SEEN_KEY, JSON.stringify([...seen]));
}

let reasonsCache = [];

const identityBackdrop = document.getElementById('identityBackdrop');
const addBackdrop = document.getElementById('addBackdrop');
const archiveBackdrop = document.getElementById('archiveBackdrop');
const menuBtn = document.getElementById('menuBtn');
const menuPanel = document.getElementById('menuPanel');
const reasonCard = document.getElementById('reasonCard');
const reasonTextEl = document.getElementById('reasonText');
const reasonMetaEl = document.getElementById('reasonMeta');
const revealCaption = document.getElementById('revealCaption');

let toastTimeout = null;
function showToast(message, duration){
  const t = document.getElementById('toast');
  t.textContent = message;
  t.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(()=>t.classList.remove('show'), duration || 2200);
}

function openIdentityModal(){ identityBackdrop.classList.add('show'); }
function closeIdentityModal(){ identityBackdrop.classList.remove('show'); }
document.getElementById('identityA').addEventListener('click', ()=>{ setIdentity('A'); closeIdentityModal(); });
document.getElementById('identityB').addEventListener('click', ()=>{ setIdentity('B'); closeIdentityModal(); });
identityBackdrop.addEventListener('click', (e)=>{ if(e.target === identityBackdrop) closeIdentityModal(); });

menuBtn.addEventListener('click', (e)=>{
  e.stopPropagation();
  menuPanel.classList.toggle('show');
});
document.addEventListener('click', (e)=>{
  if(menuPanel.classList.contains('show') && !menuPanel.contains(e.target) && e.target !== menuBtn){
    menuPanel.classList.remove('show');
  }
});
document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Escape') return;
  identityBackdrop.classList.remove('show');
  addBackdrop.classList.remove('show');
  archiveBackdrop.classList.remove('show');
  menuPanel.classList.remove('show');
  document.body.style.overflow = '';
});

document.getElementById('menuAdd').addEventListener('click', ()=>{
  menuPanel.classList.remove('show');
  if(!getIdentity()){ openIdentityModal(); return; }
  document.getElementById('reasonInput').value = '';
  document.getElementById('reasonFormError').classList.remove('show');
  addBackdrop.classList.add('show');
});
document.getElementById('addClose').addEventListener('click', ()=>addBackdrop.classList.remove('show'));
addBackdrop.addEventListener('click', (e)=>{ if(e.target === addBackdrop) addBackdrop.classList.remove('show'); });

document.getElementById('reasonForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const errorEl = document.getElementById('reasonFormError');
  const text = document.getElementById('reasonInput').value.trim();
  const who = getIdentity();
  try{
    if(!text){
      errorEl.textContent = 'Write something first.';
      errorEl.classList.add('show');
      return;
    }
    if(!who){
      errorEl.textContent = 'Something went wrong knowing who you are — reload and try again.';
      errorEl.classList.add('show');
      return;
    }
    errorEl.classList.remove('show');
    set(push(ref(db, 'reasons')), { author: who, text, time: Date.now() }).then(()=>{
      addBackdrop.classList.remove('show');
      showToast('Saved \u2713');
    }).catch(err=>{
      errorEl.textContent = 'Error: ' + (err && err.message ? err.message : String(err));
      errorEl.classList.add('show');
    });
  } catch(err){
    errorEl.textContent = 'Error: ' + (err && err.message ? err.message : String(err));
    errorEl.classList.add('show');
  }
});

let archiveScope = 'theirs';
function renderArchive(){
  const who = getIdentity();
  const el = document.getElementById('archiveList');
  if(!who){
    el.innerHTML = `<p class="archive-empty">pick who you are first.</p>`;
    return;
  }
  const list = archiveScope === 'theirs'
    ? reasonsCache.filter(r => r.author !== who)
    : reasonsCache.filter(r => r.author === who);
  const sorted = list.slice().sort((a,b)=>b.time-a.time);
  if(sorted.length === 0){
    el.innerHTML = archiveScope === 'theirs'
      ? `<p class="archive-empty">nothing from ${nameFor(otherOf(who))} yet.</p>`
      : `<p class="archive-empty">you haven't added any yet.</p>`;
    return;
  }
  el.innerHTML = sorted.map(r=>{
    const d = new Date(r.time).toLocaleDateString([], {month:'short', day:'numeric', year:'numeric'});
    const deleteBtn = archiveScope === 'mine'
      ? `<button type="button" class="archive-delete" data-id="${r.id}" aria-label="Delete">&times;</button>`
      : '';
    return `<div class="archive-item">
      <div class="archive-item-row">
        <p class="archive-text">"${escapeHtml(r.text)}"</p>
        ${deleteBtn}
      </div>
      <div class="archive-meta">${nameFor(r.author)} \u00b7 ${d}</div>
    </div>`;
  }).join('');
  el.querySelectorAll('.archive-delete').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      remove(ref(db, 'reasons/' + btn.dataset.id));
    });
  });
}
document.querySelectorAll('.archive-tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    archiveScope = btn.dataset.scope;
    document.querySelectorAll('.archive-tab').forEach(b=>b.classList.toggle('active', b===btn));
    renderArchive();
  });
});
document.getElementById('menuArchive').addEventListener('click', ()=>{
  menuPanel.classList.remove('show');
  if(!getIdentity()){ openIdentityModal(); return; }
  archiveScope = 'theirs';
  document.querySelectorAll('.archive-tab').forEach(b=>b.classList.toggle('active', b.dataset.scope==='theirs'));
  renderArchive();
  archiveBackdrop.classList.add('show');
});
document.getElementById('archiveClose').addEventListener('click', ()=>archiveBackdrop.classList.remove('show'));
archiveBackdrop.addEventListener('click', (e)=>{ if(e.target === archiveBackdrop) archiveBackdrop.classList.remove('show'); });

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function pickReason(){
  const who = getIdentity();
  if(!who) return null;
  const pool = reasonsCache.filter(r => r.author !== who);
  if(pool.length === 0) return { empty:true };
  const seen = getSeenIds();
  let unseen = pool.filter(r => !seen.has(r.id));
  if(unseen.length === 0) unseen = pool;
  const pick = unseen[Math.floor(Math.random()*unseen.length)];
  markSeen(pick.id);
  return pick;
}

function setReasonContent(pick){
  const who = getIdentity();
  if(pick.empty){
    reasonTextEl.textContent = 'Nothing from ' + nameFor(otherOf(who)) + ' yet \u2014 nudge them to add one.';
    reasonMetaEl.textContent = '';
  } else {
    reasonTextEl.textContent = '"' + pick.text + '"';
    const d = new Date(pick.time).toLocaleDateString([], {month:'short', day:'numeric'});
    reasonMetaEl.textContent = '\u2014 ' + nameFor(pick.author) + ', ' + d;
  }
}

/* One reveal per calendar day. The specific reason revealed today
   is remembered (not just the fact that one was revealed), so
   reopening the page later the same day still shows it. */
const REVEAL_DATE_KEY = 'missedyou_reasons_reveal_date';
const REVEAL_ID_KEY = 'missedyou_reasons_reveal_id';

function todayKey(){
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}
function getTodaysReveal(){
  if(localStorage.getItem(REVEAL_DATE_KEY) === todayKey()){
    return localStorage.getItem(REVEAL_ID_KEY) || 'EMPTY';
  }
  return null;
}
function recordTodaysReveal(id){
  localStorage.setItem(REVEAL_DATE_KEY, todayKey());
  localStorage.setItem(REVEAL_ID_KEY, id);
}

function initCardState(){
  const todays = getTodaysReveal();
  if(todays === null) return;
  const reason = todays === 'EMPTY' ? { empty:true } : (reasonsCache.find(r=>r.id===todays) || { empty:true });
  setReasonContent(reason);
  reasonCard.classList.add('is-revealed');
  revealCaption.textContent = 'that\u2019s today\u2019s \u2014 come back tomorrow';
}

reasonCard.addEventListener('click', ()=>{
  if(!getIdentity()){ openIdentityModal(); return; }
  if(getTodaysReveal() !== null){
    showToast('one a day \u2014 come back tomorrow');
    return;
  }
  const pick = pickReason();
  if(!pick) return;
  recordTodaysReveal(pick.empty ? 'EMPTY' : pick.id);
  setReasonContent(pick);
  reasonCard.classList.add('is-revealed');
  revealCaption.textContent = 'that\u2019s today\u2019s \u2014 come back tomorrow';
});

let hasInitedCard = false;
onValue(ref(db, 'reasons'), (snapshot)=>{
  const val = snapshot.val() || {};
  reasonsCache = Object.keys(val).map(key => ({ id: key, ...val[key] }));
  if(archiveBackdrop.classList.contains('show')) renderArchive();
  if(!hasInitedCard){
    initCardState();
    hasInitedCard = true;
  }
});

if(!getIdentity()) openIdentityModal();
</script>

</body>
</html>
